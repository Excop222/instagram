<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VibeX</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- APP WRAPPER -->
    <div id="app">
        <!-- FEED (SCROLL AREA) -->
        <div id="feed">
            <!-- POST (this will repeat later using JS) -->
            <div class="post"
                  data-likes="15600"
                  data-comments="621"
                  data-shares="1524">
                <!-- VIDEO -->
                <video class="post-video" src="video1.mp4" autoplay muted loop></video>
                    <!-- CAPTION -->
                    <div class="caption">
                        <strong>@elisha</strong>
                        <p>This is my fisrt VibeX video🔥</p>
                    </div> 
            </div>
            <div class="post"
                  data-likes="6000"
                  data-comments="500"
                  data-shares="2000">
                <video src="video2.mp4" muted loop></video>
                <div class="caption">
                    <strong>@elisha</strong>
                    <p>second video</p>
                </div>
            </div>
            <div class="post"
                  data-likes="7000"
                  data-comments="400"
                  data-shares="1000">
                <video src="video3.mp4" muted loop></video>
                <div class="caption">
                    <strong>@elisha</strong>
                    <p>Third video caption</p>
                </div>
            </div>
        </div>
        <!-- GLOBAL SIDE ICONS (ONLY ONE) -->
        <div id="side-icons">
            <div class="icon-track">
                <div id="icon-inner">
                ❤ <span id="likes">0</span><br>
                💬 <span id="comments">0</span><br>
                🔁 <span id="shares">0</span>
                </div>
            </div>
        </div>
        <!-- BOTTOM NAV -->
        <div id="bottom-nav">
            <button>Home</button>
            <button>Friends</button>
            <button id="addBtn">➕</button>
            <button>Inbox</button>
            <button>Profile</button>
        </div>
        <!-- OVERLAY -->
        <div id="createoverlay">
            <div class="overlay-content">
                <h3>Create post</h3>
                <button id="pickPhoto">Photo</button>
                <button id="pickVideo">Video</button>
                <textarea id="captionInput" placeholder="Write a caption..."></textarea>
                <button id="postBtn">Post</button>
                <button id="closeoverlay">Cancel</button>
                <input type="file" id="photoInput" accept="image/*" hidden>
                <input type="file" id="videoInput" accept="video/*" hidden>
            </div>
        </div>
    </div>
    <script src="script.js" defer></script>
</body>
</html>
